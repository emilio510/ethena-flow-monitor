name: Refresh Ethena snapshot

# Ethena's API is unreachable from Vercel egress (Cloudflare anti-bot), so
# production reads a committed snapshot. GitHub-hosted runners have
# residential-grade IP reputation and are NOT challenged, so we refresh the
# snapshot here and commit it. The push to main triggers a Vercel redeploy,
# which picks up the new data/*.json as a static import.
#
# Daily is plenty — Ethena's backing composition shifts on a hours-to-days
# timescale. Manual runs are available via workflow_dispatch.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

# Allow the job to commit + push the refreshed snapshot.
permissions:
  contents: write

# Never run two refreshes at once.
concurrency:
  group: refresh-ethena-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh snapshot from Ethena API
        run: node --experimental-strip-types scripts/refresh-ethena-snapshot.ts

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No change in data/ — Ethena snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: refresh ethena snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
